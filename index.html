<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projeto de Rede: planeje, instale e teste redes de verdade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#E9EFF3; --painel:#F7F9FA; --painel-2:#FFFFFF; --tinta:#1E2A33; --tinta-2:#5B6B77; --linha:#C9D4DB;
  --parede:#33424D; --sala:#FFFFFF; --cat6:#2F6FDB; --fibra:#E8822A; --ok:#169E6B; --aviso:#D99A0B; --erro:#D0453F; --wifi:rgba(22,158,107,.12);
  --titulo:"IBM Plex Sans Condensed","Arial Narrow",sans-serif; --texto:"IBM Plex Sans","Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --papel:#141B21; --painel:#1B242B; --painel-2:#212C34; --tinta:#E4EBF0; --tinta-2:#98A8B4; --linha:#34444F; --sala:#1F2A31; --parede:#8FA3B1; } }
:root[data-theme="dark"]{ --papel:#141B21; --painel:#1B242B; --painel-2:#212C34; --tinta:#E4EBF0; --tinta-2:#98A8B4; --linha:#34444F; --sala:#1F2A31; --parede:#8FA3B1; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
*,*::before,*::after{ box-sizing:inherit }
html{ scroll-padding-top:env(safe-area-inset-top,0px) }
body{ margin:0; background:var(--papel); color:var(--tinta); font-family:var(--texto); font-size:15px; line-height:1.45 }
button,input,select{ font:inherit; color:inherit }
:focus-visible{ outline:3px solid var(--cat6); outline-offset:2px }

.topo{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 14px; background:var(--painel); border-bottom:1px solid var(--linha) }
.marca{ display:flex; gap:10px; align-items:center; margin-right:auto }
.marca h1{ margin:0; font-family:var(--titulo); font-size:1.4rem; line-height:1 }
.marca small{ display:block; color:var(--tinta-2); font-size:.85rem }
.missao-nome{ font-family:var(--titulo); font-size:1.05rem }
.custo{ font-family:var(--mono); font-size:.95rem; padding:4px 10px; border-radius:6px; background:var(--painel-2); border:1px solid var(--linha) }
.custo.estourou{ color:var(--erro); border-color:var(--erro) }
.btn{ border:0; background:var(--cat6); color:#fff; border-radius:7px; padding:8px 13px; font-weight:600; cursor:pointer }
.btn.sec{ background:var(--painel-2); color:var(--tinta); border:1px solid var(--linha) }
.btn:disabled{ opacity:.5; cursor:not-allowed }
.btn:hover:not(:disabled){ filter:brightness(1.07) }

.app{ display:grid; grid-template-columns:230px minmax(0,1fr) 340px; gap:10px; padding:10px; min-height:calc(100vh - 60px) }
.painel{ background:var(--painel); border:1px solid var(--linha); border-radius:10px; padding:10px; min-width:0 }
.painel h2{ margin:0 0 8px; font-family:var(--titulo); font-size:1.08rem }
.paleta{ display:flex; flex-direction:column; gap:6px }
.equip{ display:flex; gap:8px; align-items:center; padding:6px 8px; border:1px solid var(--linha); border-radius:8px; background:var(--painel-2); cursor:grab; touch-action:none; user-select:none }
.equip:hover{ border-color:var(--tinta-2) }
.equip svg{ flex:0 0 34px; width:34px; height:34px }
.equip b{ display:block; font-size:.9rem; line-height:1.15 }
.equip span{ font-size:.78rem; color:var(--tinta-2) }
.ferramentas{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px }
.ferramentas button{ border:1px solid var(--linha); background:var(--painel-2); border-radius:8px; padding:7px 6px; cursor:pointer; font-size:.86rem; font-weight:600; display:flex; gap:6px; align-items:center; justify-content:center }
.ferramentas button[aria-pressed="true"]{ background:var(--tinta); color:var(--painel); border-color:var(--tinta) }
.ferramentas .linha-cat6{ width:18px; height:4px; background:var(--cat6); border-radius:2px } .ferramentas .linha-fibra{ width:18px; height:4px; background:var(--fibra); border-radius:2px }
.opcoes{ display:flex; flex-direction:column; gap:6px; margin-top:10px; font-size:.88rem }
.opcoes label{ display:flex; gap:6px; align-items:center }

.planta-box{ position:relative; background:var(--painel); border:1px solid var(--linha); border-radius:10px; overflow:hidden; min-height:420px }
#planta{ width:100%; height:100%; display:block; touch-action:none; min-height:420px }
.equip.cfg{ background:color-mix(in srgb, var(--cat6) 7%, var(--painel-2)) }
.nota-sinal{ font-size:.78rem; color:var(--tinta-2); margin:6px 2px 0 }
.obst{ cursor:pointer }
.dica-ferramenta{ position:absolute; left:10px; bottom:10px; background:var(--painel-2); border:1px solid var(--linha); border-radius:7px; padding:5px 10px; font-size:.85rem; color:var(--tinta-2); pointer-events:none; max-width:70% }
.aviso{ position:absolute; left:50%; bottom:12px; transform:translateX(-50%); background:var(--painel-2); color:var(--tinta); border:1px solid var(--linha); border-left:5px solid var(--ok); padding:9px 13px; border-radius:8px; box-shadow:0 8px 22px rgba(0,0,0,.18); max-width:min(620px,92%); display:none; z-index:3 }
.aviso.on{ display:block } .aviso.erro{ border-left-color:var(--erro) }

.abas{ display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap }
.abas button{ border:1px solid var(--linha); background:var(--painel-2); padding:6px 10px; border-radius:7px; cursor:pointer; font-weight:600; font-size:.88rem }
.abas button[aria-selected="true"]{ background:var(--tinta); color:var(--painel); border-color:var(--tinta) }
.aba[hidden]{ display:none }
.form{ display:grid; gap:7px }
.form label{ display:grid; gap:2px; font-size:.84rem; color:var(--tinta-2) }
.form input,.form select{ padding:6px 8px; border:1px solid var(--linha); border-radius:6px; background:var(--painel-2); color:var(--tinta) }
.form input.mono{ font-family:var(--mono) }
.form .linha2{ display:grid; grid-template-columns:1fr 1fr; gap:6px }
.form .check{ display:flex; gap:6px; align-items:center; color:var(--tinta) }
.estado{ padding:8px 10px; border-radius:7px; background:var(--painel-2); border:1px solid var(--linha); font-size:.88rem; margin-bottom:8px }
.estado b.ok{ color:var(--ok) } .estado b.aviso{ color:var(--aviso) } .estado b.erro{ color:var(--erro) }
.req{ list-style:none; margin:0; padding:0 }
.req li{ display:grid; grid-template-columns:22px 1fr; gap:6px; padding:7px 0; border-bottom:1px solid var(--linha); font-size:.9rem }
.req li .s{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:.75rem; font-weight:700; color:#fff; background:var(--erro) }
.req li.ok .s{ background:var(--ok) }
.req li small{ display:block; color:var(--tinta-2) }
.req li.atual{ background:color-mix(in srgb, var(--cat6) 10%, transparent); border-radius:6px }
.seg-dif{ display:inline-flex; border:1px solid var(--linha); border-radius:8px; padding:2px; background:var(--painel-2) } .seg-dif button{ border:0; background:transparent; padding:5px 10px; border-radius:6px; font-weight:600; cursor:pointer } .seg-dif button[aria-pressed="true"]{ background:var(--tinta); color:var(--painel) }
.disp.off{ opacity:.35 } .pacote{ pointer-events:none }
.terminal{ background:#0E1419; color:#CDE3D4; font-family:var(--mono); font-size:.8rem; border-radius:8px; padding:8px; height:280px; overflow:auto; white-space:pre-wrap }
.term-linha{ display:flex; gap:6px; margin-top:6px }
.term-linha input{ flex:1; font-family:var(--mono); padding:6px 8px; border-radius:6px; border:1px solid var(--linha); background:var(--painel-2) }
.mat{ width:100%; border-collapse:collapse; font-size:.86rem } .mat td{ padding:5px 4px; border-bottom:1px solid var(--linha) } .mat td:last-child{ text-align:right; font-family:var(--mono) }
.mat tr.total td{ font-weight:700; border-top:2px solid var(--tinta) }

.janela{ position:fixed; inset:0; background:rgba(10,18,24,.55); display:none; place-items:center; z-index:50; padding:14px }
.janela.on{ display:grid }
.cartao{ background:var(--painel-2); color:var(--tinta); border-radius:12px; max-width:820px; width:100%; max-height:calc(100vh - 28px); overflow:auto; padding:20px; box-shadow:0 30px 70px rgba(0,0,0,.35) }
.cartao h2{ margin:0 0 6px; font-family:var(--titulo); font-size:1.6rem; line-height:1.1 }
.missoes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-top:12px }
.missoes button{ text-align:left; border:1.5px solid var(--linha); background:var(--painel); border-radius:10px; padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:4px }
.missoes button:hover{ border-color:var(--cat6) }
.missoes b{ font-family:var(--titulo); font-size:1.12rem } .missoes span{ font-size:.86rem; color:var(--tinta-2) } .missoes .nv{ color:var(--cat6); font-weight:600 } .missoes .est{ color:#C9971A }
.acoes{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px }
.estrelas{ font-size:2rem; color:#E0A800; letter-spacing:.2em }
.campo{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px } .campo input{ flex:1 1 180px; padding:8px; border:1px solid var(--linha); border-radius:7px; background:var(--painel) }
textarea.saida{ width:100%; margin-top:8px; font-family:var(--mono); font-size:.8rem; border:1px solid var(--linha); border-radius:7px; background:var(--painel); padding:8px }

/* svg */
.cel-livre{ fill:transparent }
.disp{ cursor:grab } .disp.sel .moldura{ stroke:var(--cat6); stroke-width:3 }
.alcance{ fill:var(--wifi); stroke:rgba(22,158,107,.5); stroke-dasharray:4 4; pointer-events:none }
.cabo{ fill:none; stroke-width:3.2; stroke-linejoin:round; pointer-events:stroke; cursor:pointer }
.cabo.cat6{ stroke:var(--cat6) } .cabo.fibra{ stroke:var(--fibra); stroke-width:4 } .cabo.caido{ stroke:var(--erro); stroke-dasharray:7 5 }
.cabo.loop{ stroke:var(--erro) }
.rotulo{ font-family:var(--mono); font-size:9.5px; fill:var(--tinta-2); pointer-events:none }
.nome-disp{ font-family:var(--texto); font-size:10px; font-weight:600; fill:var(--tinta); pointer-events:none }
.sala-nome{ font-family:var(--titulo); font-size:13px; fill:var(--tinta-2); pointer-events:none }

@media (max-width:1150px){
  .app{ grid-template-columns:1fr }
  .planta-box{ order:1; position:sticky; top:0; z-index:4; min-height:0 } #planta{ min-height:0; height:auto; aspect-ratio:960/616 } .dica-ferramenta{ display:none }
  .painel.esq{ order:2 } .painel.dir{ order:3 }
  .paleta{ flex-direction:row; overflow-x:auto } .equip{ flex:0 0 auto }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important } }
</style>
</head>
<body>
<header class="topo">
  <div class="marca">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="2" y="2" width="32" height="32" rx="5" fill="#2F6FDB"/><g fill="#fff"><rect x="15" y="6" width="6" height="6" rx="1"/><rect x="6" y="24" width="6" height="6" rx="1"/><rect x="15" y="24" width="6" height="6" rx="1"/><rect x="24" y="24" width="6" height="6" rx="1"/></g><path d="M18 12v6M9 24v-6h18v6M18 18v6" stroke="#fff" stroke-width="2" fill="none"/></svg>
    <div><h1>Projeto de Rede</h1><small>Planeje, instale e teste redes de verdade</small></div>
  </div>
  <span class="missao-nome" id="missaoNome"></span>
  <span class="custo" id="custo">R$ 0</span>
  <span class="seg-dif" role="group" aria-label="Dificuldade"><button id="dTreino" aria-pressed="true">Treino</button><button id="dDesafio" aria-pressed="false">Desafio</button></span>
  <button class="btn sec" id="bDesfazer" title="Desfazer (Ctrl+Z)">Desfazer</button>
  <button class="btn sec" id="bMissoes">Projetos</button>
  <button class="btn" id="bEntregar">Entregar projeto</button>
</header>

<main class="app">
  <section class="painel esq" aria-label="Equipamentos e ferramentas">
    <h2>Ferramentas</h2>
    <div class="ferramentas" role="group" aria-label="Ferramenta">
      <button data-f="mover" aria-pressed="true">✋ Mover</button>
      <button data-f="cat6" aria-pressed="false"><span class="linha-cat6"></span> Cabo Cat6</button>
      <button data-f="fibra" aria-pressed="false"><span class="linha-fibra"></span> Fibra</button>
      <button data-f="apagar" aria-pressed="false">✖ Apagar</button>
    </div>
    <div class="paleta" id="paleta"></div>
    <div class="opcoes">
      <label><input type="checkbox" id="optCobertura" checked> Mostrar mapa de sinal Wi-Fi</label>
      <label><input type="checkbox" id="optIPs" checked> Mostrar endereços IP</label>
    </div>
  </section>

  <section class="planta-box" aria-label="Planta do local">
    <svg id="planta" viewBox="0 0 960 600" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Planta baixa do projeto"></svg>
    <div class="dica-ferramenta" id="dicaF"></div>
    <div class="aviso" id="aviso" role="status"></div>
  </section>

  <aside class="painel dir" aria-label="Painel do projeto">
    <div class="abas" role="tablist">
      <button role="tab" data-aba="req" aria-selected="true">Requisitos</button>
      <button role="tab" data-aba="prop" aria-selected="false">Configurar</button>
      <button role="tab" data-aba="term" aria-selected="false">Terminal</button>
      <button role="tab" data-aba="mat" aria-selected="false">Materiais</button>
    </div>
    <div class="aba" id="aba-req"><p id="briefing" style="margin:0 0 8px"></p><ul class="req" id="listaReq"></ul></div>
    <div class="aba" id="aba-prop" hidden><div id="props"><p>Clique em um equipamento na planta para configurá-lo.</p></div></div>
    <div class="aba" id="aba-term" hidden>
      <p style="margin:0 0 6px;font-size:.88rem;color:var(--tinta-2)">Selecione um computador na planta e digite um comando: <code>ipconfig</code>, <code>ping 192.168.0.1</code>, <code>ping google.com</code>, <code>tracert google.com</code>, <code>nslookup google.com</code>.</p>
      <div class="terminal" id="terminal" aria-live="polite"></div>
      <form class="term-linha" id="termForm"><input id="termIn" autocomplete="off" spellcheck="false" aria-label="Comando"><button class="btn">Executar</button></form>
    </div>
    <div class="aba" id="aba-mat" hidden><table class="mat" id="materiais"></table></div>
  </aside>
</main>
<div class="janela" id="janela"><div class="cartao" id="cartao"></div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const svg = $('#planta');
const CEL = 36, COLS = 26, LINS = 16;
const guardar = { ler: (k, p) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : p; } catch (e) { return p; } }, gravar: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =========================================================
   1. EQUIPAMENTOS
   ========================================================= */
const TIPOS = {
  pc: { nome: 'Computador', preco: 0, portas: 1, cliente: true, desc: 'Estação de trabalho com placa de rede cabeada.' },
  notebook: { nome: 'Notebook', preco: 0, portas: 1, cliente: true, wifiCliente: true, desc: 'Conecta por Wi-Fi a um ponto de acesso no alcance.' },
  impressora: { nome: 'Impressora de rede', preco: 0, portas: 1, cliente: true, desc: 'Impressora compartilhada. Precisa de IP fixo para não "sumir" da rede.' },
  servidor: { nome: 'Servidor de arquivos', preco: 0, portas: 1, cliente: true, desc: 'Guarda arquivos compartilhados. Precisa de IP fixo.' },
  modem: { nome: 'Modem/ONT da operadora', preco: 0, portas: 1, desc: 'Traz a internet da operadora. Liga-se à porta WAN do roteador.' },
  roteador: { nome: 'Roteador Wi-Fi', preco: 350, portas: 5, wifi: 12, dbm: 17, desc: '1 porta WAN + 4 LAN. Faz NAT, distribui IPs por DHCP e tem Wi-Fi de 17 dBm (menos alcance que um ponto de acesso).' },
  switch8: { nome: 'Switch 8 portas', preco: 180, portas: 8, desc: 'Liga até 8 equipamentos por cabo na mesma rede local.' },
  switch24: { nome: 'Switch 24 portas + 2 SFP', preco: 1200, portas: 24, sfp: 2, desc: '24 portas de cobre e 2 portas SFP para fibra óptica. Ideal para rack.' },
  ap: { nome: 'Access Point Wi-Fi', preco: 420, portas: 1, wifi: 16, dbm: 20, desc: 'Amplia a cobertura Wi-Fi com 20 dBm de potência. Ligue-o por cabo a um switch ou ao roteador.' }
};
const MATERIAIS = {
  gesso: { nome: 'Parede de gesso (drywall)', db: 3, cor: '#E8E2D5', borda: '#C3B9A5' },
  madeira: { nome: 'Porta de madeira', db: 4, cor: '#B98A55', borda: '#8A6234' },
  vidro: { nome: 'Janela de vidro', db: 3, cor: '#BFE3EF', borda: '#7FB6C8' },
  alvenaria: { nome: 'Parede de alvenaria (tijolo)', db: 6, cor: '#C98B6B', borda: '#9A6144' },
  estante: { nome: 'Estante de livros', db: 6, cor: '#A9763F', borda: '#7A5228' },
  concreto: { nome: 'Parede de concreto armado', db: 12, cor: '#9AA3A8', borda: '#6E787D' },
  agua: { nome: "Caixa d'água ou aquário", db: 15, cor: '#7FC3E8', borda: '#3E86AE' },
  metal: { nome: 'Armário ou estrutura metálica', db: 20, cor: '#B6BDC2', borda: '#7C868C' },
  elevador: { nome: 'Caixa de elevador (metal)', db: 25, cor: '#8D969C', borda: '#5C6468' }
};
const PAREDE_DB = 6; // paredes das salas da planta contam como alvenaria
const CABO = { cat6: { nome: 'Cabo Cat6', preco: 3, conector: 4 }, fibra: { nome: 'Fibra óptica', preco: 8, conector: 150 } };
const INFRA = ['roteador', 'switch8', 'switch24', 'ap'];
function icone(t, s = 1) {
  const g = {
    pc: '<rect x="-13" y="-12" width="26" height="17" rx="2" fill="#3A4A56"/><rect x="-11" y="-10" width="22" height="13" fill="#9FD0F5"/><rect x="-3" y="5" width="6" height="4" fill="#3A4A56"/><rect x="-8" y="9" width="16" height="3" rx="1" fill="#3A4A56"/>',
    notebook: '<rect x="-11" y="-11" width="22" height="14" rx="2" fill="#3A4A56"/><rect x="-9" y="-9" width="18" height="10" fill="#9FD0F5"/><path d="M-15 4 h30 l-3 5 h-24z" fill="#56687A"/>',
    impressora: '<rect x="-9" y="-13" width="18" height="8" fill="#fff" stroke="#3A4A56" stroke-width="1.5"/><rect x="-14" y="-6" width="28" height="13" rx="2" fill="#56687A"/><rect x="-9" y="4" width="18" height="8" fill="#fff" stroke="#3A4A56" stroke-width="1.5"/>',
    servidor: '<rect x="-9" y="-14" width="18" height="28" rx="2" fill="#3A4A56"/><g fill="#6FD69A"><circle cx="-4" cy="-8" r="1.6"/><circle cx="-4" cy="-1" r="1.6"/><circle cx="-4" cy="6" r="1.6"/></g><g stroke="#8B9CAA" stroke-width="1.5"><path d="M0 -8h6M0 -1h6M0 6h6"/></g>',
    modem: '<rect x="-14" y="-6" width="28" height="12" rx="3" fill="#56687A"/><g fill="#6FD69A"><circle cx="-8" cy="0" r="1.6"/><circle cx="-3" cy="0" r="1.6"/><circle cx="2" cy="0" r="1.6"/></g><path d="M8 -6 v-8" stroke="#56687A" stroke-width="2"/>',
    roteador: '<ellipse cx="0" cy="3" rx="15" ry="8" fill="#2F6FDB"/><ellipse cx="0" cy="0" rx="15" ry="8" fill="#4E8AF0"/><path d="M-7 0h14M3 -3l4 3-4 3M-3 -3l-4 3 4 3" stroke="#fff" stroke-width="1.6" fill="none"/><path d="M-9 -7 v-7 M9 -7 v-7" stroke="#2F6FDB" stroke-width="2"/>',
    switch8: '<rect x="-15" y="-7" width="30" height="14" rx="2" fill="#2F6FDB"/><g fill="#CFE0FB">' + [0, 1, 2, 3].map(i => `<rect x="${-12 + i * 7}" y="-3" width="5" height="5"/>`).join('') + '</g><path d="M-10 -11 h8 l-3 -2 M10 11 h-8 l3 2" stroke="#2F6FDB" stroke-width="1.5" fill="none"/>',
    switch24: '<rect x="-16" y="-8" width="32" height="16" rx="2" fill="#1D4FA8"/><g fill="#CFE0FB">' + [0, 1, 2, 3, 4, 5].map(i => `<rect x="${-14 + i * 4.6}" y="-5" width="3.6" height="3.6"/><rect x="${-14 + i * 4.6}" y="0" width="3.6" height="3.6"/>`).join('') + '</g><rect x="13" y="-5" width="2" height="9" fill="#E8822A"/>',

}

const term = $('#terminal');
function caminho(de, para) {
  const prev = { [de]: null }, fila = [de];

  if (!(para in prev)) return { rota: null, alcance: Object.keys(prev).map(Number) };
  const c = []; for (let x = para; x != null; x = prev[x]) c.unshift(+x); return { rota: c };
}

    else { const alvoD = disp(dest); const perto = r.alcance.filter(i => i !== orig.id).sort((a, b) => Math.hypot(disp(a).x - alvoD.x, disp(a).y - alvoD.y) - Math.hypot(disp(b).x - alvoD.x, disp(b).y - alvoD.y))[0]; if (perto != null) rota = caminho(orig.id, perto).rota || rota; }

    if (k < 1) return requestAnimationFrame(passo);
    const fimP = pts[pts.length - 1]; c.setAttribute('fill', falha ? '#D0453F' : '#169E6B');
    if (falha) { const x = document.createElementNS(NS, 'text'); x.setAttribute('x', fimP.x + 10); x.setAttribute('y', fimP.y - 10); x.setAttribute('class', 'pacote'); x.setAttribute('fill', '#D0453F'); x.setAttribute('font-size', '22'); x.setAttribute('font-weight', '700'); x.textContent = '✗'; svg.appendChild(x); setTimeout(() => x.remove(), 1600); }
    setTimeout(() => c.remove(), 1400);
  };

}
function termOut(t) { term.textContent += t + '\n'; term.scrollTop = term.scrollHeight; }
function termPrompt() { const d = disp(sel); termOut(d && TIPOS[d.tipo].cliente ? `\n${d.nome}>` : '\nSelecione um computador, notebook, impressora ou servidor na planta.'); }
function alvoPorTexto(t) {
  const n = ipNum(t); if (n) { if (SIM.roteador && ipNum(SIM.roteador.cfg.ip) === n) return SIM.roteador; return D.find(d => SIM.disp[d.id] && SIM.disp[d.id].ip === n) || (n === ipNum('8.8.8.8') ? 'internet' : null); }
  const d = D.find(x => x.nome.toLowerCase() === t.toLowerCase()); return d || (/\.(com|br|org|net)/.test(t) ? 'nome' : null);
}
$('#termForm').onsubmit = e => {
  e.preventDefault(); const cmd = $('#termIn').value.trim(); $('#termIn').value = ''; if (!cmd) return;
  const d = disp(sel); termOut(cmd);
  if (!d || !TIPOS[d.tipo].cliente) { termOut('Selecione um computador na planta para usar o terminal.'); return; }
  const s = SIM.disp[d.id]; const [c, arg = ''] = cmd.split(/\s+/); const cl = c.toLowerCase();
  if (cl === 'ajuda' || cl === 'help') termOut('Comandos: ipconfig · ping <IP ou nome> · tracert <nome> · nslookup <nome> · cls');
  else if (cl === 'cls' || cl === 'clear') term.textContent = '';
  else if (cl === 'ipconfig') {
    if (!s.ip) termOut(`Adaptador de rede:\n   Endereço IPv4 (autoconfiguração): 169.254.${(d.id * 37) % 250}.${(d.id * 11) % 250}\n   Máscara: 255.255.0.0\n   Gateway padrão: (nenhum)\n${DIF === 'treino' ? `\n   → ${s.motivo || 'sem conexão'}.` : ''}`);
    else termOut(`Adaptador ${SIM.wifi[d.id] ? 'Wi-Fi' : 'Ethernet'}:\n   Modo: ${d.cfg.modo === 'dhcp' ? 'DHCP (automático)' : 'manual (IP fixo)'}\n   Endereço IPv4 . . . : ${ipTxt(s.ip)}\n   Máscara . . . . . . : ${s.mascara || d.cfg.mascara}\n   Gateway padrão  . . : ${s.gateway ? ipTxt(s.gateway) : '(nenhum)'}\n   Servidor DNS  . . . : ${s.dns || '(nenhum)'}`);
  }
  else if (cl === 'ping') {
    const alvo = alvoPorTexto(arg); termOut(`Disparando ${arg} com 32 bytes de dados:`);
    let ok = false, motivo = '';
    if (!s.ip || s.motivo && !s.lan) motivo = 'Falha geral. ' + (s.motivo || '');
    else if (alvo === 'internet' || alvo === 'nome') { ok = s.internet; if (alvo === 'nome' && s.lan && !s.dns) motivo = `A solicitação ping não pôde encontrar o host ${arg}. Verifique o nome (sem DNS configurado).`; else if (!ok) motivo = s.motivo; }
    else if (alvo && alvo.tipo) { const t = alvo.tipo === 'roteador' ? { lan: true, ip: ipNum(alvo.cfg.ip) } : SIM.disp[alvo.id]; ok = s.lan && t && t.lan && SIM.dominio.has(alvo.id); if (!ok) motivo = 'Esgotado o tempo limite do pedido.'; }
    else motivo = 'Host de destino inacessível.';
    if (ok) { const ms = alvo === 'internet' || alvo === 'nome' ? 18 : 1; for (let i = 0; i < 4; i++) termOut(`Resposta de ${alvo && alvo.tipo ? ipTxt(alvo.tipo === 'roteador' ? ipNum(alvo.cfg.ip) : SIM.disp[alvo.id].ip) : alvo === 'nome' ? '142.250.79.14' : arg}: bytes=32 tempo=${ms + (i % 3)}ms TTL=${alvo && alvo.tipo ? 64 : 117}`); termOut('Pacotes: Enviados = 4, Recebidos = 4, Perdidos = 0 (0% de perda)'); }
    else { for (let i = 0; i < 4; i++) termOut(motivo.startsWith('A solicitação') ? '' : 'Esgotado o tempo limite do pedido.'); termOut(motivo.startsWith('A solicitação') ? motivo : `Pacotes: Enviados = 4, Recebidos = 0, Perdidos = 4 (100% de perda)${DIF === 'treino' && motivo && !motivo.startsWith('Esgotado') ? '\n→ ' + motivo : ''}`); }
    animarPacote(d, alvo, ok);
  }
  else if (cl === 'tracert') {
    termOut(`Rastreando a rota para ${arg || 'google.com'}:`);
    if (!s.ip || !s.lan) termOut('  1     *        *        *     Esgotado o tempo limite do pedido.' + (DIF === 'treino' ? '\n→ ' + (s.motivo || 'sem conexão') : ''));
    else { termOut(`  1    <1 ms    <1 ms    <1 ms  ${SIM.roteador.cfg.ip}  (roteador)`); if (s.internet) { termOut('  2     6 ms     5 ms     6 ms  100.64.0.1  (operadora)\n  3    12 ms    11 ms    12 ms  187.16.216.1\n  4    18 ms    17 ms    18 ms  142.250.79.14  (destino)\nRastreamento concluído.'); } else termOut(`  2     *        *        *     Esgotado o tempo limite do pedido.${DIF === 'treino' ? '\n→ ' + s.motivo : ''}`); animarPacote(d, 'internet', s.internet); }
  }
  else if (cl === 'nslookup') {
    if (!s.dns) termOut('*** Nenhum servidor DNS configurado.'); else if (!s.internet) termOut(`Servidor: ${s.dns}\n*** Tempo esgotado: o servidor DNS não respondeu.`); else termOut(`Servidor: ${s.dns}\nNome: ${arg || 'google.com'}\nAddress: 142.250.79.14`);
  }
  else termOut(`'${c}' não é reconhecido como um comando. Digite ajuda.`);
  termPrompt();
};

/* =========================================================
   11. ATUALIZAÇÃO GERAL, REQUISITOS E MATERIAIS
   ========================================================= */
function atualizar(leve) {
  indices(); SIM = simular(); desenhar(); if (leve) return;
  const c = custoTotal(); $('#custo').textContent = M.orcamento ? `R$ ${c.toLocaleString('pt-BR')} / ${M.orcamento.toLocaleString('pt-BR')}` : `R$ ${c.toLocaleString('pt-BR')}`; $('#custo').classList.toggle('estourou', M.orcamento && c > M.orcamento);
  const ul = $('#listaReq'); ul.innerHTML = '';
  let marcouAtual = false;
  for (const k of M.req) { const r = REQ[k].f(SIM); const li = document.createElement('li'); li.className = r.ok ? 'ok' : (DIF === 'treino' && !marcouAtual ? (marcouAtual = true, 'atual') : ''); li.innerHTML = `<span class="s">${r.ok ? '✓' : '!'}</span><div>${REQ[k].t}<small>${esc(r.info)}</small></div>`; ul.appendChild(li); }
  desenharMateriais(); salvarRascunho();
  if (sel && disp(sel)) desenharProps();
}
function desenharMateriais() {
  const itens = {};
  for (const d of D.filter(d => !d.fixo)) { const k = TIPOS[d.tipo].nome; itens[k] = itens[k] || { q: 0, v: 0 }; itens[k].q++; itens[k].v += TIPOS[d.tipo].preco; }
  for (const t of ['cat6', 'fibra']) { const l = C.filter(c => c.tipo === t); if (!l.length) continue; const m = l.reduce((s, c) => s + metros(c), 0); itens[`${CABO[t].nome} (${m} m)`] = { q: 1, v: m * CABO[t].preco }; itens[t === 'fibra' ? 'Módulos SFP' : 'Conectores RJ-45'] = { q: l.length * 2, v: l.length * 2 * CABO[t].conector }; }
  $('#materiais').innerHTML = Object.entries(itens).map(([k, o]) => `<tr><td>${o.q > 1 ? o.q + '× ' : ''}${esc(k)}</td><td>R$ ${Math.round(o.v).toLocaleString('pt-BR')}</td></tr>`).join('') + `<tr class="total"><td>Total</td><td>R$ ${custoTotal().toLocaleString('pt-BR')}</td></tr>` || '<tr><td>Nenhum material ainda.</td></tr>';
}
function mudarAba(a) { document.querySelectorAll('.abas button').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === a)); document.querySelectorAll('.aba').forEach(x => x.hidden = x.id !== 'aba-' + a); if (a === 'term' && !term.textContent) { termOut('Terminal de testes. Digite ajuda para ver os comandos.'); termPrompt(); } }
document.querySelectorAll('.abas button').forEach(b => b.onclick = () => mudarAba(b.dataset.aba));
$('#optCobertura').onchange = desenhar; $('#optIPs').onchange = desenhar;
let avisoT = null;
function aviso(t, erro) { const a = $('#aviso'); a.textContent = t; a.className = 'aviso on' + (erro ? ' erro' : ''); clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove('on'), erro ? 6000 : 2800); }

/* =========================================================
   12. PROJETOS, ENTREGA E RELATÓRIO
   ========================================================= */
function abrirJanela(h) { $('#cartao').innerHTML = h; $('#janela').classList.add('on'); const b = $('#cartao').querySelector('button'); if (b) b.focus(); }
function fecharJanela() { $('#janela').classList.remove('on'); }
function telaMissoes() {
  const prog = guardar.ler('redesProgresso', {});
  abrirJanela(`<h2>Projetos de rede</h2><p>Escolha um cliente. Leia os requisitos, instale os equipamentos, ligue os cabos, configure e teste. Seu rascunho fica salvo neste navegador.</p>
    <div class="missoes">${MISSOES.map((m, i) => `<button data-i="${i}"><span class="nv">${m.nivel ? '●'.repeat(m.nivel) + '○'.repeat(3 - m.nivel) + ' nível ' + m.nivel : 'sem requisitos'}${m.tipo === 'diagnostico' ? ' · diagnóstico' : ''}</span><b>${esc(m.titulo)}</b><span>${esc(m.cliente)}${m.orcamento ? ' · orçamento R$ ' + m.orcamento.toLocaleString('pt-BR') : ''}</span><span>${esc(m.briefing.slice(0, 120))}…</span>${prog[m.id] ? `<span class="est">${'★'.repeat(prog[m.id])}</span>` : ''}</button>`).join('')}</div>`);
  document.querySelectorAll('.missoes button').forEach(b => b.onclick = () => { const m = MISSOES[+b.dataset.i]; const tem = guardar.ler('redesRascunho-' + m.id, null); carregarMissao(m, !!tem); });
}
function codigoVerificacao(txt) { let h = 5381; const s = txt + '|UNASP-JOGOS'; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36).toUpperCase().padStart(7, '0').slice(-7); }
function entregar() {

  const tudo = ok === res.length, eco = M.orcamento ? Math.max(0, M.orcamento - custo) : 0;
  const est = tudo ? (M.orcamento && custo <= M.orcamento * 0.85 ? 3 : 2) : ok >= res.length * 0.7 ? 1 : 0;
  const pts = ok * 150 + (tudo ? 400 : 0) + Math.round(eco / 10) + est * 100;
  const min = Math.round((Date.now() - inicio) / 60000);
  if (M.id !== 'livre') { const prog = guardar.ler('redesProgresso', {}); prog[M.id] = Math.max(prog[M.id] || 0, est); guardar.gravar('redesProgresso', prog); }
  abrirJanela(`<h2>${tudo ? 'Projeto aprovado pelo cliente!' : 'O cliente pediu ajustes'}</h2><div class="estrelas">${'★'.repeat(est)}${'☆'.repeat(3 - est)}</div>
    <p>${ok} de ${res.length} requisitos atendidos · custo R$ ${custo.toLocaleString('pt-BR')}${M.orcamento ? ` (economia de R$ ${eco.toLocaleString('pt-BR')})` : ''} · ${pts} pontos</p>

    ${tudo && est < 3 && M.orcamento ? '<p>Para 3 estrelas, atenda tudo gastando até 85% do orçamento.</p>' : ''}
    <div class="campo"><input id="rNome" placeholder="Seu nome completo" maxlength="40"><input id="rTurma" placeholder="Turma" maxlength="12" style="max-width:160px"></div>
    <div class="acoes"><button class="btn" id="bRes">Gerar resultado para o professor</button><button class="btn sec" id="bVoltar">${tudo ? 'Ver o projeto' : 'Continuar ajustando'}</button><button class="btn sec" id="bOutro">Outro projeto</button></div>
    <textarea class="saida" id="rSaida" rows="3" readonly hidden></textarea>`);
  $('#bVoltar').onclick = fecharJanela; $('#bOutro').onclick = telaMissoes;
  const al0 = guardar.ler('__x', null) || (() => { try { return JSON.parse(sessionStorage.getItem('perfilAluno')); } catch (e) { return null; } })(); if (al0) { $('#rNome').value = al0.nome; $('#rTurma').value = al0.turma; }
  const reg = guardar.ler('redesRegistro', []); res.forEach(r => reg.push({ conceito: REQ[r.k].t, certo: !!r.ok, missao: M.id, dif: DIF })); guardar.gravar('redesRegistro', reg.slice(-500));
  const bx = document.createElement('button'); bx.className = 'btn sec'; bx.textContent = 'Exportar arquivo para o professor'; $('#cartao .acoes').appendChild(bx);

    const R2 = guardar.ler('redesRegistro', []), pc = {}; R2.forEach(x => { const c = pc[x.conceito] = pc[x.conceito] || { conceito: x.conceito, tema: 'Redes', tentativas: 0, acertos: 0 }; c.tentativas++; if (x.certo) c.acertos++; });
    const d = { app: 'Projeto de Rede', tipo: 'simulador', versao: 2, aluno: { nome, turma }, data: new Date().toISOString(), resumo: { ultimoProjeto: M.titulo, requisitos: `${ok}/${res.length}`, custo, estrelas: est, dificuldade: DIF, progresso: guardar.ler('redesProgresso', {}) }, conceitos: Object.values(pc), maisErradas: [] };
    d.codigo = codigoVerificacao(JSON.stringify(d.resumo) + nome + turma + d.app);
    const txt = JSON.stringify(d); try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = `${nome.replace(/\s+/g, '_')}-${turma}-redes.json`; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { }
    const t = $('#rSaida'); t.hidden = false; t.value = txt;
  };
  $('#bRes').onclick = () => {
    const linha = `Projeto de Rede (${M.titulo});${$('#rNome').value.trim() || 'sem nome'};${$('#rTurma').value.trim() || 'sem turma'};${new Date().toLocaleString('pt-BR')};${pts} pontos;requisitos ${ok}/${res.length};custo R$ ${custo};estrelas ${est};tempo ${min} min`;
    const t = $('#rSaida'); t.hidden = false; t.value = linha + ';código ' + codigoVerificacao(linha); try { navigator.clipboard.writeText(t.value); $('#bRes').textContent = 'Resultado copiado'; } catch (e) { t.select(); }
  };
}
function setDif(x) { DIF = x; guardar.gravar('redesDif', x); $('#dTreino').setAttribute('aria-pressed', x === 'treino'); $('#dDesafio').setAttribute('aria-pressed', x === 'desafio'); atualizar(); if (sel) desenharProps(); aviso(x === 'desafio' ? 'Modo desafio: o painel não mostra mais a causa das falhas. Use o terminal para investigar.' : 'Modo treino: o painel mostra a causa das falhas.', false); }
$('#dTreino').onclick = () => setDif('treino'); $('#dDesafio').onclick = () => setDif('desafio');
DIF = guardar.ler('redesDif', 'treino');
$('#bMissoes').onclick = telaMissoes; $('#bEntregar').onclick = entregar; $('#bDesfazer').onclick = desfazer;
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); desfazer(); } if (e.key === 'Escape') { cabA = null; desenhar(); } });
$('#janela').addEventListener('click', e => { if (e.target.id === 'janela' && M) fecharJanela(); });

setFerramenta('mover'); $('#dTreino').setAttribute('aria-pressed', DIF === 'treino'); $('#dDesafio').setAttribute('aria-pressed', DIF === 'desafio');

</script>
